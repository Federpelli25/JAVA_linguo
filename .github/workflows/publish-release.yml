name: Pubblica release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  create-release:
    name: Crea la release GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Scarica il tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verifica che tag e VERSION coincidano
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"

      - name: Pubblica le note di rilascio
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --title "JAVA_linguo $GITHUB_REF_NAME"
          --generate-notes
