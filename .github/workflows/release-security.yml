name: Integrità release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  attest-release:
    name: SBOM, checksum e attestazione
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Scarica il tag pubblicato
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Configura Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Installa dipendenze bloccate dal lockfile
        run: npm ci --ignore-scripts

      - name: Genera archivio, SBOM e checksum
        shell: bash
        run: |
          archive="studio-java-${{ github.event.release.tag_name }}.zip"
          git archive --format=zip --output="$archive" HEAD
          npm sbom --sbom-format=cyclonedx > studio-java-sbom.cdx.json
          sha256sum "$archive" studio-java-sbom.cdx.json > SHA256SUMS.txt

      - name: Attesta la provenienza dell'archivio
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: studio-java-${{ github.event.release.tag_name }}.zip

      - name: Pubblica gli artefatti verificabili
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          "studio-java-${{ github.event.release.tag_name }}.zip"
          studio-java-sbom.cdx.json
          SHA256SUMS.txt
          --clobber
